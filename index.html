<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    :root {

      --text: #1c1c28;

      --brand-2: #eef0ff;
      --ok: #e8f7ec;
      --ok-text: #165a2f;
      --bad: #fff1ee;
      --bad-text: #a33612;
      --border: #e7e9f3;
      --shadow: 0 18px 48px rgba(26, 33, 61, 0.08);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { padding: 14px; }
    .app { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    .top { padding: 16px; position: sticky; top: 0; z-index: 5; backdrop-filter: blur(10px); }
    .title { font-size: 1.35rem; font-weight: 800; margin: 0; }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 0.94rem; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .chip { background: #f4f5fa; border: 1px solid var(--border); border-radius: 999px; padding: 8px 12px; font-size: 0.84rem; font-weight: 700; }
    .screen { min-height: 72vh; padding: 16px; display: grid; gap: 14px; align-content: start; }
    .hero { padding: 16px; background: linear-gradient(135deg, #eef0ff, #ffffff); }
    .hero h2 { margin: 0 0 8px; font-size: 1rem; }
    .hero p { margin: 0; line-height: 1.55; }
    .status { padding: 14px 16px; font-weight: 700; }
    .status.loading { color: var(--muted); }
    .status.error { background: var(--bad); color: var(--bad-text); }
    .question { padding: 18px; }
    .eyebrow { color: var(--muted); font-size: 0.84rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
    .question h3 { margin: 10px 0 0; font-size: 1.1rem; line-height: 1.45; }
    .options { display: grid; gap: 10px; }
    button.option { width: 100%; text-align: left; border: 1px solid var(--border); border-radius: 18px; background: #fff; color: var(--text); padding: 14px; font: inherit; font-weight: 700; cursor: pointer; }
    button.option:hover { border-color: #cfd5ff; background: #fafbff; }
    button.option.correct { background: var(--ok); color: var(--ok-text); border-color: #b5e1c2; }
    button.option.wrong { background: var(--bad); color: var(--bad-text); border-color: #ffc8b8; }
    button.option:disabled { cursor: default; }
    .feedback { padding: 16px; line-height: 1.55; display: none; }
    .feedback.show { display: block; }
    .feedback.correct { background: var(--ok); color: var(--ok-text); }
    .feedback.wrong { background: var(--bad); color: var(--bad-text); }
    .actions { display: flex; gap: 10px; }
    .btn { border: 0; border-radius: 16px; background: var(--brand); color: #fff; padding: 14px 16px; font: inherit; font-weight: 800; cursor: pointer; }
    .btn.secondary { background: #edf0ff; color: var(--brand); }
    .hidden { display: none !important; }
    .result { padding: 18px; text-align: center; }
    .score { font-size: 2.1rem; font-weight: 900; margin: 10px 0 4px; }
    .small { color: var(--muted); font-size: 0.92rem; }
    @media (max-width: 480px) { body { padding: 10px; } .screen { padding: 12px; } .title { font-size: 1.2rem; } }
  </style>
</head>

  <main class="app">

        <div class="chip" id="progressChip">Question --</div>

        <p id="factText"></p>
      </section>

      <section class="card question hidden" id="questionCard">
        <div class="eyebrow" id="metaText"></div>
        <h3 id="questionText"></h3>
      </section>

      <section class="options hidden" id="optionsList"></section>

      <section class="card feedback" id="feedback"></section>

      <div class="actions hidden" id="actions">
        <button class="btn" id="nextBtn">Next question</button>
      </div>

      <section class="card result hidden" id="resultCard">
        <div class="small">Set complete</div>
        <div class="score" id="finalScore"></div>

      </section>
    </section>

    const els = {
      status: document.getElementById('status'),
      setChip: document.getElementById('setChip'),
      progressChip: document.getElementById('progressChip'),
      scoreChip: document.getElementById('scoreChip'),
      factCard: document.getElementById('factCard'),
      factText: document.getElementById('factText'),
      questionCard: document.getElementById('questionCard'),
      metaText: document.getElementById('metaText'),
      questionText: document.getElementById('questionText'),
      optionsList: document.getElementById('optionsList'),
      feedback: document.getElementById('feedback'),
      actions: document.getElementById('actions'),
      nextBtn: document.getElementById('nextBtn'),
      resultCard: document.getElementById('resultCard'),
      finalScore: document.getElementById('finalScore')
    };

    let currentSet = null;
    let questionIndex = 0;
    let flashIndex = 0;
    let score = 0;
    let answered = false;
    let stage = 'loading';
    let flashTimer = null;

    function show(el) { el.classList.remove('hidden'); }
    function hide(el) { el.classList.add('hidden'); }
    function clearFlashTimer() {
      if (flashTimer) {
        clearTimeout(flashTimer);
        flashTimer = null;
      }
    }

    async function fetchAssignedSet() {
      const response = await fetch('/api/next-set', { method: 'POST' });
      const data = await response.json().catch(() => ({ ok: false, error: 'invalid_json' }));
      if (!response.ok || !data.ok) throw new Error(data.message || 'Unable to assign a set.');
      return data.set;
    }

    function updateChips() {
      els.setChip.textContent = `Set ${currentSet.set_number}`;
      if (stage === 'flash') {
        els.progressChip.textContent = `Clue ${Math.min(flashIndex + 1, currentSet.questions.length)} / ${currentSet.questions.length}`;
      } else if (stage === 'quiz') {
        els.progressChip.textContent = `Question ${Math.min(questionIndex + 1, currentSet.questions.length)} / ${currentSet.questions.length}`;
      } else if (stage === 'result') {
        els.progressChip.textContent = 'Completed';
      } else {
        els.progressChip.textContent = 'Loading';
      }
      els.scoreChip.textContent = `Score ${score}`;
    }

    function renderFlash() {
      const q = currentSet.questions[flashIndex];
      stage = 'flash';
      updateChips();
      hide(els.resultCard);
      hide(els.questionCard);
      hide(els.optionsList);
      hide(els.feedback);
      hide(els.actions);
      show(els.factCard);
      show(els.status);
      els.factText.textContent = q.flash_fact || '';
      els.status.className = 'card status loading';
      els.status.innerHTML = `<strong>Flash card ${flashIndex + 1} of ${currentSet.questions.length}</strong><br>Memorize this clue. Questions will appear after all flash cards finish.`;
      clearFlashTimer();
      flashTimer = setTimeout(() => {
        if (flashIndex < currentSet.questions.length - 1) {
          flashIndex += 1;
          renderFlash();
        } else {
          questionIndex = 0;
          renderQuestion();
        }
      }, 3200);
    }

    function renderQuestion() {
      clearFlashTimer();
      stage = 'quiz';
      const q = currentSet.questions[questionIndex];
      answered = false;
      updateChips();
      hide(els.resultCard);
      hide(els.factCard);
      hide(els.feedback);
      hide(els.actions);
      show(els.questionCard);
      show(els.optionsList);
      show(els.status);
      els.status.className = 'card status loading';
      els.status.textContent = 'Choose the best answer.';
      els.metaText.textContent = `${q.category || 'Quiz'}${q.subtopic ? ' • ' + q.subtopic : ''}`;
      els.questionText.textContent = q.question;
      els.optionsList.innerHTML = '';
      const entries = Object.entries(q.options || {});
      for (const [key, value] of entries) {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.type = 'button';
        btn.innerHTML = `<strong>${key}.</strong> ${value}`;
        btn.addEventListener('click', () => chooseAnswer(key, btn));
        els.optionsList.appendChild(btn);
      }
    }

    function chooseAnswer(choice, clickedButton) {
      if (answered) return;
      answered = true;
      const q = currentSet.questions[questionIndex];
      const isCorrect = choice === q.answer;
      if (isCorrect) score += 1;
      updateChips();

      [...els.optionsList.querySelectorAll('button')].forEach((btn) => {
        btn.disabled = true;
        const key = btn.textContent.trim().charAt(0);
        if (key === q.answer) btn.classList.add('correct');
        else if (btn === clickedButton) btn.classList.add('wrong');
      });

      hide(els.status);
      els.feedback.className = `card feedback show ${isCorrect ? 'correct' : 'wrong'}`;
      els.feedback.innerHTML = isCorrect
        ? `<strong>Correct.</strong> ${q.answer_text || ''}` + (q.flash_fact ? `<br><br>${q.flash_fact}` : '')
        : `<strong>Answer:</strong> ${q.answer}. ${q.answer_text || ''}` + (q.flash_fact ? `<br><br>${q.flash_fact}` : '');
      show(els.actions);
      els.nextBtn.textContent = questionIndex < currentSet.questions.length - 1 ? 'Next question' : 'Finish';
    }

    els.nextBtn.addEventListener('click', () => {
      if (questionIndex < currentSet.questions.length - 1) {
        questionIndex += 1;
        renderQuestion();
      } else {
        finishQuiz();
      }
    });

    function finishQuiz() {
      clearFlashTimer();
      stage = 'result';
      hide(els.factCard);
      hide(els.questionCard);
      hide(els.optionsList);
      hide(els.feedback);
      hide(els.actions);
      hide(els.status);
      show(els.resultCard);
      updateChips();
      els.finalScore.textContent = `${score} / ${currentSet.questions.length}`;
    }

    async function init() {
      try {
        const setNumber = await fetchAssignedSet();
        currentSet = GAME_DATA.sets.find((s) => s.set_number === setNumber);
        if (!currentSet) throw new Error(`Set ${setNumber} not found in page data.`);
        questionIndex = 0;
        flashIndex = 0;
        score = 0;
        renderFlash();
      } catch (err) {
        els.status.className = 'card status error';
        els.status.textContent = err.message || 'Unable to connect to the server.';
        show(els.status);
      }
    }

    init();
  </script>
</body>
