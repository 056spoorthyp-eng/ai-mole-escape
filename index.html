<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payroll Quiz</title>
  <style>
    :root {
      --artifact-background: #ffffff;
      --artifact-background-light: #f6f6f6;
      --artifact-background-mid: #f0f0f0;
      --artifact-border-light: #e5e5e5;
      --artifact-primary-brand: #343ced;
      --artifact-text-primary: #1b1b1b;
      --artifact-text-secondary: #727272;
      --artifact-text-highlight: #fff8e5;
      --artifact-sky: #a9e0ff;
      --artifact-pink: #f1b7ff;
      --artifact-yellow: #ffdf69;
      --artifact-peach: #ffcfbd;
      --artifact-green: #daf181;
      --artifact-success-background: #e9f7ef;
      --artifact-success-text: #1b1b1b;
      --artifact-error-background: #fff0ea;
      --artifact-error-text: #7d2f00;
      --artifact-shadow: 0 18px 48px rgba(0,0,0,0.10);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; color: var(--artifact-text-primary); background: radial-gradient(circle at 0% 0%, rgba(169,224,255,.22), transparent 28%), radial-gradient(circle at 100% 0%, rgba(241,183,255,.18), transparent 24%), radial-gradient(circle at 100% 100%, rgba(255,223,105,.14), transparent 26%), var(--artifact-background); }
    body { padding: 14px; }
    .app { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
    .card { background: rgba(255,255,255,.88); border: 1px solid var(--artifact-border-light); border-radius: 28px; box-shadow: var(--artifact-shadow); }
    .panel { padding: 18px; }
    .title { font-size: clamp(1.8rem, 8vw, 2.6rem); line-height: .95; letter-spacing: -.06em; font-weight: 900; margin: 0; }
    .subtitle, .muted { color: var(--artifact-text-secondary); line-height: 1.55; margin: 0; }
    .badge { display: inline-flex; align-items: center; justify-content: center; width: max-content; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--artifact-border-light); background: var(--artifact-background-light); font-size: .78rem; font-weight: 900; text-transform: uppercase; letter-spacing: .05em; }
    .stack { display: grid; gap: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 8px 12px; border-radius: 999px; background: var(--artifact-background-light); border: 1px solid var(--artifact-border-light); font-size: .84rem; font-weight: 800; }
    .chip span { color: var(--artifact-text-secondary); margin-right: 4px; }
    .screen { min-height: 72vh; padding: 16px; display: flex; }
    .view { width: 100%; display: none; animation: fadeUp .35s ease both; }
    .view.active { display: flex; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0);} }
    .center { align-items: center; justify-content: center; text-align: center; }
    .field { display:grid; gap:8px; text-align:left; }
    label { font-weight:800; }
    input { width:100%; padding:14px 16px; border-radius:16px; border:1px solid var(--artifact-border-light); background: var(--artifact-background-light); color: var(--artifact-text-primary); font: inherit; }
    button { appearance:none; border:0; cursor:pointer; border-radius:18px; font: inherit; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(1px) scale(.995); }
    .btn-primary { padding:15px 18px; background: var(--artifact-primary-brand); color: var(--artifact-text-highlight); font-weight:800; box-shadow: 0 10px 24px rgba(52,60,237,.24); }
    .message { padding:12px 14px; border-radius:16px; border:1px solid var(--artifact-border-light); background: var(--artifact-background-light); color: var(--artifact-text-secondary); text-align:left; }
    .message.error { background: var(--artifact-error-background); color: var(--artifact-error-text); }
    .message.success { background: var(--artifact-success-background); color: var(--artifact-success-text); }
    .flash-view, .question-view, .result-view { flex-direction: column; gap: 16px; width: 100%; }
    .flash-card { width: 100%; min-height: 54vh; border-radius: 26px; border: 1px solid var(--artifact-border-light); padding: 18px; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; background: linear-gradient(135deg, rgba(169,224,255,.36), rgba(241,183,255,.24)); }
    .flash-card.alt1 { background: linear-gradient(135deg, rgba(241,183,255,.30), rgba(246,246,246,.8)); }
    .flash-card.alt2 { background: linear-gradient(135deg, rgba(255,223,105,.26), rgba(246,246,246,.8)); }
    .flash-card.alt3 { background: linear-gradient(135deg, rgba(255,207,189,.30), rgba(246,246,246,.8)); }
    .flash-card.alt4 { background: linear-gradient(135deg, rgba(218,241,129,.28), rgba(246,246,246,.8)); }
    .flash-meta { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .tag { padding:8px 10px; border-radius:999px; background: rgba(255,255,255,.78); border:1px solid var(--artifact-border-light); font-size:.78rem; font-weight:900; }
    .flash-text { display:grid; place-items:center; text-align:center; font-size: clamp(1.7rem, 7vw, 2.9rem); line-height:1.04; letter-spacing:-.05em; font-weight:900; }
    .hint { text-align:center; color: var(--artifact-text-secondary); font-weight:700; }
    .progress { width:100%; height:12px; border-radius:999px; background: var(--artifact-background-mid); overflow:hidden; border:1px solid var(--artifact-border-light); }
    .bar { height:100%; width:0%; background: linear-gradient(90deg, var(--artifact-primary-brand), #888eff); transition: width .2s linear; }
    .q-meta { display:flex; flex-wrap:wrap; gap:8px; }
    .q-title { font-size: clamp(1.35rem, 6vw, 2rem); line-height:1.15; letter-spacing:-.04em; font-weight:900; margin:0; }
    .answers { display:grid; gap:10px; }
    .answer { width:100%; text-align:left; padding:14px; min-height:68px; display:flex; gap:12px; align-items:center; border-radius:18px; border:1px solid var(--artifact-border-light); background: var(--artifact-background-light); color: var(--artifact-text-primary); font-weight:800; }
    .answer .letter { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background: var(--artifact-background); border:1px solid var(--artifact-border-light); font-weight:900; flex:0 0 38px; }
    .answer.correct { background: var(--artifact-success-background); color: var(--artifact-success-text); }
    .answer.wrong { background: var(--artifact-error-background); color: var(--artifact-error-text); }
    .feedback { min-height:52px; padding:12px 14px; border-radius:16px; border:1px solid var(--artifact-border-light); background: var(--artifact-background-light); font-weight:700; color: var(--artifact-text-secondary); }
    .feedback.success { background: var(--artifact-success-background); color: var(--artifact-success-text); }
    .feedback.error { background: var(--artifact-error-background); color: var(--artifact-error-text); }
    .ring { width:180px; height:180px; margin:0 auto; border-radius:50%; display:grid; place-items:center; position:relative; background: conic-gradient(var(--artifact-primary-brand) 0deg, var(--artifact-background-mid) 0deg 360deg); }
    .ring::after { content:''; position:absolute; width:132px; height:132px; border-radius:50%; background: var(--artifact-background); border:1px solid var(--artifact-border-light); }
    .ring-text { position:relative; z-index:1; display:grid; gap:2px; }
    .score-n { font-size:2.3rem; font-weight:900; letter-spacing:-.05em; }
    .score-l { color: var(--artifact-text-secondary); font-size:.9rem; font-weight:800; }
    .result-title { font-size: clamp(1.6rem, 7vw, 2.2rem); line-height:1; letter-spacing:-.04em; font-weight:900; margin:0; text-align:center; }
    .result-copy { margin:0; color: var(--artifact-text-secondary); line-height:1.55; text-align:center; }
  </style>
</head>
<body>
  <main class="app">
    <section class="card panel"><div class="chips" id="chips"></div></section>
    <section class="card screen" id="screen"></section>
  </main>
  <script>
    const GAME_DATA = {"sets":[{"set_number":1,"questions":[{"question_id":1,"category":"ESS Login","subtopic":"ESS Login","question":"Where can you compare tax calculations between old and new regimes on the ESS portal?","options":{"A":"Reports section","B":"Investment Declaration (Calculate tab)","C":"Payslip section","D":"Profile settings"},"answer":"B","answer_text":"Investment Declaration (Calculate tab)","flash_fact":"Compare old vs new tax regimes in ESS under Investment Declaration → Calculate tab."},{"question_id":8,"category":"PF","subtopic":"PF","question":"For employees joining after 2014, EPS eligibility depends on:","options":{"A":"Age","B":"First basic salary","C":"Department","D":"Location"},"answer":"B","answer_text":"First Basic salary","flash_fact":"For employees joining after 2014, EPS eligibility depends on the first Basic salary."},{"question_id":13,"category":"Tax","subtopic":"General","question":"Surcharge is applicable under:","options":{"A":"Only old regime","B":"Only new regime","C":"Both regimes","D":"Neither"},"answer":"C","answer_text":"Both regimes","flash_fact":"Surcharge applies in both the old and the new tax regimes."},{"question_id":18,"category":"Tax","subtopic":"Exemption","question":"Is landlord PAN mandatory when annual rent exceeds ₹1,00,000 per annum for HRA exemption?","options":{"A":"Yes","B":"No"},"answer":"A","answer_text":"Yes","flash_fact":"Landlord PAN is mandatory when annual rent exceeds ₹1,00,000 per annum for HRA exemption."},{"question_id":36,"category":"FAT and DBT","subtopic":"FAT","question":"What is FAT in the UAN account process?","options":{"A":"Financial Approval Task","B":"Facial Authentication Technology","C":"Form Access Token","D":"Fund Activation Tool"},"answer":"B","answer_text":"Facial Authentication Technology","flash_fact":"FAT in the UAN process means Facial Authentication Technology."}]},{"set_number":2,"questions":[{"question_id":2,"category":"ESS Login","subtopic":"ESS Login","question":"Which option should you use to calculate your tax after declaring investments?","options":{"A":"Submit","B":"Preview","C":"Calculate tab","D":"History"},"answer":"C","answer_text":"Calculate tab","flash_fact":"After declaring investments, use the Calculate tab to compute your tax."},{"question_id":9,"category":"PF","subtopic":"PF","question":"If your first salary is more than ₹15,000, EPS eligibility is:","options":{"A":"Eligible","B":"Not eligible","C":"Partially eligible","D":"Depends on HR"},"answer":"B","answer_text":"Not eligible","flash_fact":"If the first basic salary is above ₹15,000, EPS eligibility is not available."},{"question_id":14,"category":"Tax","subtopic":"General","question":"Meal benefits are applicable in:","options":{"A":"Only old regime","B":"Only new regime","C":"Both regimes","D":"None"},"answer":"C","answer_text":"Both regimes","flash_fact":"Meal benefits are available in both tax regimes."},{"question_id":25,"category":"Tax","subtopic":"Deductions","question":"What is Section 80EEA mainly related to?","options":{"A":"Medical insurance premium deduction","B":"Additional deduction on eligible home-loan interest","C":"Deduction on school fees","D":"Deduction on rent paid"},"answer":"B","answer_text":"Additional deduction on eligible home-loan interest","flash_fact":"Section 80EEA covers additional deduction on eligible home-loan interest."},{"question_id":41,"category":"FAT and DBT","subtopic":"DBT","question":"What does DBT stand for?","options":{"A":"Direct Benefit Transfer","B":"Digital Bank Transaction","C":"Data Benefit Tracking","D":"Direct Balance Transfer"},"answer":"A","answer_text":"Direct Benefit Transfer","flash_fact":"DBT stands for Direct Benefit Transfer."}]},{"set_number":3,"questions":[{"question_id":3,"category":"ESS Login","subtopic":"ESS Login","question":"Where can you declare your NPS details in the India Payroll Application?","options":{"A":"Reports section","B":"FBP Declaration","C":"Payslip section","D":"Reimbursement tab"},"answer":"B","answer_text":"FBP Declaration","flash_fact":"NPS details are declared in the India Payroll Application under FBP Declaration."},{"question_id":10,"category":"PF","subtopic":"PF","question":"PF transfer is required when:","options":{"A":"You change your job","B":"You get a bonus","C":"You take leave","D":"You switch departments"},"answer":"A","answer_text":"You change your job","flash_fact":"PF transfer is required when an employee changes jobs."},{"question_id":15,"category":"Tax","subtopic":"General","question":"When can an employee choose the tax regime?","options":{"A":"Anytime during the year","B":"Only in the 1st payroll month","C":"Cannot change during the year","D":"Monthly"},"answer":"B","answer_text":"Only in the 1st payroll month","flash_fact":"The tax regime can be chosen only in the 1st payroll month."},{"question_id":31,"category":"Tax","subtopic":"Education Loan","question":"Can Section 80E generally apply for higher studies in India as well as abroad, subject to conditions?","options":{"A":"Yes","B":"No","C":"Only for studies in India","D":"Only for studies abroad"},"answer":"A","answer_text":"Yes","flash_fact":"Section 80E can generally apply to higher studies in India as well as abroad, subject to conditions."},{"question_id":37,"category":"FAT and DBT","subtopic":"FAT","question":"Why is FAT activation required?","options":{"A":"For office attendance","B":"For smooth processing of EPFO services","C":"For salary revision approval","D":"For income-tax filing"},"answer":"B","answer_text":"For smooth processing of EPFO services","flash_fact":"FAT activation is required for smooth processing of EPFO services."}]},{"set_number":4,"questions":[{"question_id":4,"category":"ESS Login","subtopic":"ESS Login","question":"Where can you declare Voluntary Provident Fund (VPF)?","options":{"A":"Reports","B":"India Payroll → VPF Declaration","C":"Payslip","D":"Investment Proof"},"answer":"B","answer_text":"India Payroll -> VPF Declaration","flash_fact":"Voluntary Provident Fund is declared in India Payroll → VPF Declaration."},{"question_id":11,"category":"PF","subtopic":"PF","question":"PF transfer may get rejected due to:","options":{"A":"Name mismatch","B":"DOB mismatch","C":"Service date mismatch","D":"All of the above"},"answer":"D","answer_text":"All of the above","flash_fact":"PF transfer can fail because of name mismatch, date-of-birth mismatch, or service-date mismatch."},{"question_id":19,"category":"Tax","subtopic":"Exemption","question":"Which are metro cities for HRA exemption?","options":{"A":"Mumbai, Delhi, Kolkata, and Chennai","B":"Bengaluru, Hyderabad, Pune, and Ahmedabad","C":"Only A","D":"Both A and B"},"answer":"C","answer_text":"Mumbai, Delhi, Kolkata, and Chennai","flash_fact":"For HRA, metro cities are Mumbai, Delhi, Kolkata, and Chennai."},{"question_id":26,"category":"Tax","subtopic":"Deductions","question":"What is the maximum deduction available under Section 80EEA?","options":{"A":"₹50,000","B":"₹1,00,000","C":"₹1,50,000","D":"₹2,00,000"},"answer":"C","answer_text":"₹1,50,000","flash_fact":"The maximum deduction under Section 80EEA is ₹1,50,000."},{"question_id":42,"category":"FAT and DBT","subtopic":"DBT","question":"Under which scheme will eligible employees receive benefits directly in their bank accounts?","options":{"A":"PMVBRY","B":"EPFSY","C":"UAN Benefit Plan","D":"DBT Plus"},"answer":"A","answer_text":"PMVBRY","flash_fact":"Eligible employees receive benefits directly in their bank accounts under PMVBRY."}]},{"set_number":5,"questions":[{"question_id":5,"category":"ESS Login","subtopic":"ESS Login","question":"Which windows are opened in the India Payroll application from the 1st to 10th of every month?","options":{"A":"FBP","B":"NPS and VPF","C":"Investment Declaration","D":"All of the above"},"answer":"D","answer_text":"All of the above","flash_fact":"From the 1st to the 10th, India Payroll opens FBP, NPS, and VPF windows."},{"question_id":12,"category":"PF","subtopic":"PF","question":"PF contribution can be calculated on:","options":{"A":"Higher wages","B":"Restricted wages","C":"Both A and B","D":"Only bonus"},"answer":"C","answer_text":"Both A or B","flash_fact":"PF contribution can be calculated on higher wages or restricted wages."},{"question_id":20,"category":"Tax","subtopic":"Exemption","question":"When does the tenant have to deduct TDS on rent paid to the landlord?","options":{"A":"When monthly rent exceeds ₹8,333","B":"When monthly rent exceeds ₹50,000","C":"Only B","D":"Both A and B"},"answer":"C","answer_text":"When monthly rent exceeds ₹50,000","flash_fact":"Rent TDS applies when monthly rent paid to the landlord exceeds ₹50,000."},{"question_id":32,"category":"Tax","subtopic":"Education Loan","question":"For whose higher education can Section 80E generally be claimed, subject to conditions?","options":{"A":"Self only","B":"Self, spouse, children, or a student for whom the taxpayer is legal guardian","C":"Friends only","D":"Employees only"},"answer":"B","answer_text":"Self, spouse, children, or a student for whom the taxpayer is legal guardian","flash_fact":"Section 80E can generally be claimed for self, spouse, children, or a student for whom the taxpayer is legal guardian."},{"question_id":38,"category":"FAT and DBT","subtopic":"FAT","question":"Which of the following should be linked and verified with UAN before FAT activation?","options":{"A":"PAN","B":"Aadhaar","C":"Passport","D":"Driving licence"},"answer":"B","answer_text":"Aadhaar","flash_fact":"Aadhaar must be linked and verified with UAN before FAT activation."}]},{"set_number":6,"questions":[{"question_id":6,"category":"ESS Login","subtopic":"ESS Login","question":"For new joiners after April, IT declaration should be submitted:","options":{"A":"Anytime","B":"Before the deadline specified","C":"Not required","D":"Next year"},"answer":"B","answer_text":"Before the specified deadline","flash_fact":"For new joiners after April, IT declaration must be submitted before the specified deadline."},{"question_id":16,"category":"PF","subtopic":"PF","question":"When can an employee initiate PF transfer?","options":{"A":"When EPS contribution exists and the date of exit is updated in the EPFO portal by the previous employer","B":"Immediately after joining the new employer","C":"Only after linking the bank account in the payroll portal","D":"Only after one full payroll cycle"},"answer":"A","answer_text":"When EPS contribution exists and the date of exit is updated in the EPFO portal by the previous employer","flash_fact":"PF transfer can be initiated only after EPS contribution exists and the previous employer updates the date of exit in EPFO."},{"question_id":21,"category":"Tax","subtopic":"Exemption","question":"Is declaring the relationship with the landlord mandatory under HRA exemption?","options":{"A":"Yes","B":"No"},"answer":"A","answer_text":"Yes","flash_fact":"Under HRA exemption, declaring the relationship with the landlord is mandatory."},{"question_id":27,"category":"Tax","subtopic":"Deductions","question":"Which loan sanction period is relevant for Section 80EEA eligibility?","options":{"A":"1 April 2016 to 31 March 2017","B":"1 April 2018 to 31 March 2019","C":"1 April 2019 to 31 March 2022","D":"1 April 2022 to 31 March 2025"},"answer":"C","answer_text":"1 April 2019 to 31 March 2022","flash_fact":"For Section 80EEA, the relevant loan sanction period is 1 April 2019 to 31 March 2022."},{"question_id":43,"category":"FAT and DBT","subtopic":"DBT","question":"What should employees ensure with their bank account for DBT?","options":{"A":"It is closed and reopened","B":"DBT is enabled and Aadhaar is seeded","C":"It is linked only with PAN","D":"It is salary-only enabled"},"answer":"B","answer_text":"DBT is enabled and Aadhaar is seeded","flash_fact":"For DBT, the bank account must have DBT enabled and Aadhaar seeded."}]},{"set_number":7,"questions":[{"question_id":7,"category":"ESS Login","subtopic":"ESS Login","question":"Within what time frame should the regime be opted in the India Payroll application?","options":{"A":"Within 48 hours of getting the welcome email from the Mynd Solutions team","B":"Every month","C":"Anytime","D":"At financial year-end only"},"answer":"A","answer_text":"Within 48 hours of receiving the welcome email from Mynd Solutions team","flash_fact":"The tax regime must be opted within 48 hours of the welcome email from the Mynd Solutions team."},{"question_id":17,"category":"PF","subtopic":"PF","question":"When can an employee initiate PF transfer?","options":{"A":"When EPS contribution exists and the date of exit is updated in the EPFO portal by the previous employer","B":"Immediately after joining the new employer","C":"Only after linking the bank account in the payroll portal","D":"Only after one full payroll cycle"},"answer":"A","answer_text":"When EPS contribution exists and the date of exit is updated in the EPFO portal by the previous employer","flash_fact":"PF transfer can be initiated only after EPS contribution exists and the previous employer updates the date of exit in EPFO."},{"question_id":22,"category":"Tax","subtopic":"Exemption","question":"HRA exemption is applicable on:","options":{"A":"House rent paid","B":"Electricity bill","C":"Food expenses","D":"Travel expense"},"answer":"A","answer_text":"House rent paid","flash_fact":"HRA exemption applies to house rent paid."},{"question_id":33,"category":"Tax","subtopic":"Education Loan","question":"What is Section 80E mainly related to?","options":{"A":"Medical insurance premium deduction","B":"Deduction on eligible education-loan interest for higher studies","C":"Deduction on school fees","D":"Deduction on rent paid"},"answer":"B","answer_text":"Deduction on eligible education-loan interest for higher studies","flash_fact":"Section 80E covers deduction on eligible education-loan interest for higher studies."},{"question_id":39,"category":"FAT and DBT","subtopic":"FAT","question":"Which apps should employees download for FAT activation?","options":{"A":"UMANG App and Aadhaar Face RD App","B":"EPFO App and Teams App","C":"Aadhaar App and Payroll App","D":"UMANG App only"},"answer":"A","answer_text":"UMANG App and Aadhaar Face RD App","flash_fact":"For FAT activation, employees need the UMANG App and Aadhaar Face RD App."}]},{"set_number":8,"questions":[{"question_id":1,"category":"ESS Login","subtopic":"ESS Login","question":"Where can you compare tax calculations between old and new regimes on the ESS portal?","options":{"A":"Reports section","B":"Investment Declaration (Calculate tab)","C":"Payslip section","D":"Profile settings"},"answer":"B","answer_text":"Investment Declaration (Calculate tab)","flash_fact":"Compare old vs new tax regimes in ESS under Investment Declaration → Calculate tab."},{"question_id":8,"category":"PF","subtopic":"PF","question":"For employees joining after 2014, EPS eligibility depends on:","options":{"A":"Age","B":"First basic salary","C":"Department","D":"Location"},"answer":"B","answer_text":"First Basic salary","flash_fact":"For employees joining after 2014, EPS eligibility depends on the first Basic salary."},{"question_id":23,"category":"Tax","subtopic":"Exemption","question":"NPS contribution through salary under Section 80CCD(2) is applicable under:","options":{"A":"Only old regime","B":"Only new regime","C":"Both regimes","D":"None"},"answer":"C","answer_text":"Both regimes","flash_fact":"Employer NPS contribution through salary under Section 80CCD(2) is available in both tax regimes."},{"question_id":28,"category":"Tax","subtopic":"Deductions","question":"What is Section 80EEB mainly related to?","options":{"A":"Medical insurance premium deduction","B":"Additional deduction on eligible electric-vehicle loan interest","C":"Deduction on school fees","D":"Deduction on rent paid"},"answer":"B","answer_text":"Additional deduction on eligible electric-vehicle loan interest","flash_fact":"Section 80EEB covers additional deduc m monetary limit on eligible interest paid","flash_fact":"Section 80E has no maximum monetary limit on eligible interest paid."},{"question_id":40,"category":"FAT and DBT","subtopic":"FAT","question":"Where should employees log in using their UAN credentials to complete FAT?","options":{"A":"UMANG app","B":"Bank portal","C":"PAN portal","D":"Payroll portal"},"answer":"A","answer_text":"UMANG app","flash_fact":"Employees complete FAT by logging into the UMANG app with UAN credentials."}]},{"set_number":10,"questions":[{"question_id":3,"category":"ESS Login","subtopic":"ESS Login","question":"Where can you declare your NPS details in the India Payroll Application?","options":{"A":"Reports section","B":"FBP Declaration","C":"Payslip section","D":"Reimbursement tab"},"answer":"B","answer_text":"FBP Declaration","flash_fact":"NPS details are declared in the India Payroll Application under FBP Declaration."},{"question_id":10,"category":"PF","subtopic":"PF","question":"PF transfer is required when:","options":{"A":"You change your job","B":"You get a bonus","C":"You take leave","D":"You switch departments"},"answer":"A","answer_text":"You change your job","flash_fact":"PF transfer is required when an employee changes jobs."},{"question_id":29,"category":"Tax","subtopic":"Deductions","question":"What is the maximum deduction available under Section 80EEB?","options":{"A":"₹50,000","B":"₹1,00,000","C":"₹1,50,000","D":"₹2,00,000"},"answer":"C","answer_text":"₹1,50,000","flash_fact":"The maximum deduction under Section 80EEB is ₹1,50,000."},{"question_id":35,"category":"Tax","subtopic":"Education Loan","question":"For how long can deduction under Section 80E generally be claimed?","options":{"A":"For 2 years only","B":"For 5 years only","C":"For 8 years or until interest is fully paid, whichever is earlier","D":"For the full loan tenure without any limit"},"answer":"C","answer_text":"For 8 years or until interest is fully paid, whichever is earlier","flash_fact":"Section 80E deduction can generally be claimed for 8 years or until the interest is fully paid, whichever is earlier."},{"question_id":41,"category":"FAT and DBT","subtopic":"DBT","question":"What does DBT stand for?","options":{"A":"Direct Benefit Transfer","B":"Digital Bank Transaction","C":"Data Benefit Tracking","D":"Direct Balance Transfer"},"answer":"A","answer_text":"Direct Benefit Transfer","flash_fact":"DBT stands for Direct Benefit Transfer."}]},{"set_number":11,"questions":[{"question_id":4,"category":"ESS Login","subtopic":"ESS Login","question":"Where can you declare Voluntary Provident Fund (VPF)?","options":{"A":"Reports","B":"India Payroll → VPF Declaration","C":"Payslip","D":"Investment Proof"},"answer":"B","answer_text":"India Payroll -> VPF Declaration","flash_fact":"Voluntary Provident Fund is declared in India Payroll → VPF Declaration."},{"question_id":11,"category":"PF","subtopic":"PF","question":"PF transfer may get rejected due to:","options":{"A":"Name mismatch","B":"DOB mismatch","C":"Service date mismatch","D":"All of the above"},"answer":"D","answer_text":"All of the above","flash_fact":"PF transfer can fail because of name mismatch, date-of-birth mismatch, or service-date mismatch."},{"question_id":30,"category":"Tax","subtopic":"Deductions","question":"Which loan sanction period is relevant for Section 80EEB eligibility?","options":{"A":"1 April 2016 to 31 March 2017","B":"1 April 2018 to 31 March 2019","C":"1 April 2019 to 31 March 2023","D":"1 April 2023 to 31 March 2025"},"answer":"C","answer_text":"1 April 2019 to 31 March 2023","flash_fact":"For Section 80EEB, the relevant loan sanction period is 1 April 2019 to 31 March 2023."},{"question_id":13,"category":"Tax","subtopic":"General","question":"Surcharge is applicable under:","options":{"A":"Only old regime","B":"Only new regime","C":"Both regimes","D":"Neither"},"answer":"C","answer_text":"Both regimes","flash_fact":"Surcharge applies in both the old and the new tax regimes."},{"question_id":36,"category":"FAT and DBT","subtopic":"FAT","question":"What is FAT in the UAN account process?","options":{"A":"Financial Approval Task","B":"Facial Authentication Technology","C":"Form Access Token","D":"Fund Activation Tool"},"answer":"B","answer_text":"Facial Authentication Technology","flash_fact":"FAT in the UAN process means Facial Authentication Technology."}]},{"set_number":12,"questions":[{"question_id":5,"category":"ESS Login","subtopic":"ESS Login","question":"Which windows are opened in the India Payroll application from the 1st to 10th of every month?","options":{"A":"FBP","B":"NPS and VPF","C":"Investment Declaration","D":"All of the above"},"answer":"D","answer_text":"All of the above","flash_fact":"From the 1st to the 10th, India Payroll opens FBP, NPS, and VPF windows."},{"question_id":12,"category":"PF","subtopic":"PF","question":"PF contribution can be calculated on:","options":{"A":"Higher wages","B":"Restricted wages","C":"Both A and B","D":"Only bonus"},"answer":"C","answer_text":"Both A or B","flash_fact":"PF contribution can be calculated on higher wages or restricted wages."},{"question_id":14,"category":"Tax","subtopic":"General","question":"Meal benefits are applicable in:","options":{"A":"Only old regime","B":"Only new regime","C":"Both regimes","D":"None"},"answer":"C","answer_text":"Both regimes","flash_fact":"Meal benefits are available in both tax regimes."},{"question_id":31,"category":"Tax","subtopic":"Education Loan","question":"Can Section 80E generally apply for higher studies in India as well as abroad, subject to conditions?","options":{"A":"Yes","B":"No","C":"Only for studies in India","D":"Only for studies abroad"},"answer":"A","answer_text":"Yes","flash_fact":"Section 80E can generally apply to higher studies in India as well as abroad, subject to conditions."},{"question_id":42,"category":"FAT and DBT","subtopic":"DBT","question":"Under which scheme will eligible employees receive benefits directly in their bank accounts?","options":{"A":"PMVBRY","B":"EPFSY","C":"UAN Benefit Plan","D":"DBT Plus"},"answer":"A","answer_text":"PMVBRY","flash_fact":"Eligible employees receive benefits directly in their bank accounts under PMVBRY."}]}]};
    const TOTAL_SETS = 12, FLASH_MS = 4000, FEEDBACK_MS = 1200;
    const screen = document.getElementById('screen'), chips = document.getElementById('chips');
    let timers = [], countdownInterval = null;
    let state = { stage:'gate', email:'', token:'', assignedSet:null, flashIndex:0, questionIndex:0, score:0, reveal:null, feedback:'', countdown:4, message:'', messageType:'' };
    const clearTimers = () => { timers.forEach(clearTimeout); timers=[]; clearInterval(countdownInterval); countdownInterval=null; };
    const currentSet = () => GAME_DATA.sets.find(s => s.set_number === state.assignedSet) || null;
    const escapeHtml = s => String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const flashClass = i => ['', 'alt1', 'alt2', 'alt3', 'alt4'][i % 5];
    const labelStage = () => ({ gate:'Email check', flash:'Flash clue', quiz:'Question', result:'Result' })[state.stage] || 'Ready';
    function renderChips(){ chips.innerHTML = [`<div class="chip"><span>Stage</span>${labelStage()}</div>`,`<div class="chip"><span>Set</span>${state.assignedSet || '-'}/${TOTAL_SETS}</div>`,`<div class="chip"><span>Score</span>${state.score}</div>`].join(''); }
    function renderGate(){ screen.innerHTML = `<div class="view active center"><div class="stack" style="width:100%"><div class="badge">One play per employee</div><h1 class="title">Catch the Payroll Clue</h1><p class="subtitle">Enter your office email to get your assigned quiz set. The backend will rotate sets automatically.</p><div class="field"><label for="email">Office email</label><input id="email" type="email" placeholder="name@infoblox.com" value="${escapeHtml(state.email)}" /></div>${state.message ? `<div class="message ${escapeHtml(state.messageType)}">${escapeHtml(state.message)}</div>` : ''}<button class="btn-primary" onclick="startFromEmail()">Start quiz</button></div></div>`; const input = document.getElementById('email'); input?.focus(); input?.addEventListener('keydown', e => { if (e.key === 'Enter') startFromEmail(); }); }
    function renderFlash(){ const set = currentSet(), item = set.questions[state.flashIndex]; screen.innerHTML = `<div class="view active flash-view"><div class="flash-card ${flashClass(state.flashIndex)}"><div class="flash-meta"><div class="tag">${escapeHtml(item.category)} · ${escapeHtml(item.subtopic)}</div><div class="tag">Clue ${state.flashIndex + 1} of ${set.questions.length}</div></div><div class="flash-text">${escapeHtml(item.flash_fact)}</div><div><div class="hint">Memorize the clue before it disappears</div><div class="progress"><div class="bar" style="width:${Math.max(0,(4-(state.countdown ?? 4))/4*100)}%"></div></div></div></div></div>`; }
    function renderQuiz(){ const set = currentSet(), item = set.questions[state.questionIndex]; const answers = Object.entries(item.options).map(([letter,text]) => { let cls='answer'; if (state.reveal){ if(letter===state.reveal.correct) cls+=' correct'; else if(letter===state.reveal.selected) cls+=' wrong'; } const disabled = state.reveal ? 'disabled' : ''; return `<button class="${cls}" ${disabled} onclick="selectAnswer('${letter}')"><span class="letter">${letter}</span><span>${escapeHtml(text)}</span></button>`; }).join(''); screen.innerHTML = `<div class="view active question-view"><div class="q-meta"><div class="badge">Question ${state.questionIndex + 1} of ${set.questions.length}</div><div class="badge">${escapeHtml(item.category)} · ${escapeHtml(item.subtopic)}</div></div><h2 class="q-title">${escapeHtml(item.question)}</h2><div class="answers">${answers}</div><div class="feedback ${state.reveal ? (state.reveal.isCorrect ? 'success' : 'error') : ''}">${escapeHtml(state.feedback || 'Choose the best answer.')}</div></div>`; }
    function renderResult(){ const set = currentSet(), pct = Math.round((state.score / set.questions.length) * 100); const title = state.score === set.questions.length ? 'Payroll Pro' : state.score >= 3 ? 'Great recall' : 'Thanks for playing'; const copy = state.score === set.questions.length ? 'Perfect score. Every clue landed and every answer was right on target.' : state.score >= 3 ? 'Strong round. The key payroll facts are clearly sticking.' : 'Your quiz has been submitted. Thanks for taking part.'; screen.innerHTML = `<div class="view active result-view center"><div class="badge">Round complete</div><div class="ring" style="background:conic-gradient(var(--artifact-primary-brand) ${pct*3.6}deg, var(--artifact-background-mid) 0deg 360deg)"><div class="ring-text"><div class="score-n">${state.score}/${set.questions.length}</div><div class="score-l">Final score</div></div></div><h2 class="result-title">${title}</h2><p class="result-copy">${copy}</p><div class="message success">This email has now used its one allowed play.</div></div>`; }
    function render(){ renderChips(); if(state.stage==='gate') return renderGate(); if(state.stage==='flash') return renderFlash(); if(state.stage==='quiz') return renderQuiz(); if(state.stage==='result') return renderResult(); }
    async function startFromEmail(){ clearTimers(); const input = document.getElementById('email'); const email = String(input?.value || '').trim().toLowerCase(); state.email = email; state.message = 'Checking your office email and assigning your set...'; state.messageType = ''; render(); try { const res = await fetch('/api/start', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email }) }); const data = await res.json(); if(!res.ok){ state.message = data.message || 'Unable to start the quiz.'; state.messageType = 'error'; return render(); } state.token = data.token; state.assignedSet = data.assignedSet; state.flashIndex = 0; state.questionIndex = 0; state.score = 0; state.reveal = null; state.feedback = ''; state.countdown = 4; state.stage = 'flash'; state.message = ''; state.messageType = ''; render(); runFlashSequence(); } catch (e) { state.message = 'Unable to connect to the server.'; state.messageType = 'error'; render(); } }
    function runFlashSequence(){ clearTimers(); let remaining = 4; countdownInterval = setInterval(() => { if(state.stage!=='flash'){ clearInterval(countdownInterval); return; } remaining -= 1; state.countdown = Math.max(remaining,0); render(); }, 1000); timers.push(setTimeout(() => advanceFlash(), FLASH_MS + 200)); }
    function advanceFlash(){ clearTimers(); const set = currentSet(); const nextIndex = state.flashIndex + 1; if(nextIndex < set.questions.length){ state.flashIndex = nextIndex; state.countdown = 4; render(); runFlashSequence(); } else { state.stage = 'quiz'; state.questionIndex = 0; state.reveal = null; state.feedback = ''; render(); } }
    function selectAnswer(letter){ if(state.stage!=='quiz' || state.reveal) return; const set = currentSet(); const question = set.questions[state.questionIndex]; const correct = letter === question.answer; state.reveal = { selected: letter, correct: question.answer, isCorrect: correct }; state.feedback = correct ? `Correct — ${question.answer_text}.` : `Not quite — the correct answer is ${question.answer}: ${question.answer_text}.`; if(correct) state.score += 1; render(); timers.push(setTimeout(() => advanceQuestion(), FEEDBACK_MS)); }
    function advanceQuestion(){ clearTimers(); const set = currentSet(); const nextQ = state.questionIndex + 1; if(nextQ < set.questions.length){ state.questionIndex = nextQ; state.reveal = null; state.feedback = ''; render(); } else { completeQuiz(); } }
    async function completeQuiz(){ const set = currentSet(); try { await fetch('/api/complete', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token: state.token, score: state.score, totalQuestions: set.questions.length }) }); } catch (e) {} state.stage = 'result'; render(); }
    window.startFromEmail = startFromEmail; window.selectAnswer = selectAnswer; render();
  </script>
