services:
  - type: web
    name: payroll-quiz-app
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_EMAIL_DOMAIN
        value: infoblox.com
      - key: DATABASE_URL
        fromDatabase:
          name: payroll-quiz-db
          property: connectionString

databases:
  - name: payroll-quiz-db
    plan: starter
